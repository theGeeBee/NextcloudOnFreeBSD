[http]
listen = ${talk_ip}:8080
readtimeout = 15
writetimeout = 30
[app]
debug = false
trustedproxies = ${nextcloud_ip}
[sessions]
hashkey = ${talk_session_hashkey}
blockkey = ${talk_session_blockkey}
[backend]
backends = nextcloud
allowall = false
skipverify = false
timeout = 10
connectionsperhost = 8
[nextcloud]
urls = ${backend_url}
secret = ${talk_signaling_secret}
[nats]
url = nats://127.0.0.1:4222
[mcu]
type = janus
url = ws://127.0.0.1:8188
maxstreambitrate = 1048576
maxscreenbitrate = 2097152
[stats]
allowed_ips = ${talk_ip}
