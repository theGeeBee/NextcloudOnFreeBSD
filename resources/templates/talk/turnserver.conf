# Own-IP exception permits UDP ports on this IP, NOT only the Janus range.
# Same-jail traffic need not traverse host PF. No sensitive extra UDP services.
listening-ip=${talk_ip}
relay-ip=${talk_ip}
listening-port=${talk_turn_port}
external-ip=${talk_public_ip}/${talk_ip}
min-port=${talk_relay_port_min}
max-port=${talk_relay_port_max}
realm=${realm}
use-auth-secret
static-auth-secret=${talk_turn_secret}
fingerprint
no-tls
no-dtls
no-tcp-relay
no-multicast-peers
no-cli
no-rfc5780
no-software-attribute
stale-nonce=600
user-quota=12
total-quota=128
# Bytes/s per allocation: 4 Mbit/s exceeds the 2 Mbit/s screen ceiling.
# Retain the aggregate cap: 25 full reservations, including idle ICE candidates.
max-bps=500000
bps-capacity=12500000
allocation-default-address-family=ipv4
pidfile=/var/run/turnserver/turnserver.pid
log-file=/var/log/turnserver/turnserver.log
no-stdout-log
log-min-level=warning
simple-log
allowed-peer-ip=${talk_ip}
${denied_peers}
